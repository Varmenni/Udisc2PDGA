<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PDGA CSV → TSV (first/last name)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- External CSS file -->
  <link rel="stylesheet" href="css/styles.css">
  <script src="
https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js
"></script>
<link href="
https://cdn.jsdelivr.net/npm/papaparse@5.5.3/player/player.min.css
" rel="stylesheet">
  <script src="js/app.js"></script>
</head>
<body>
  <h1>UDisc export to PDGA Tournament Director</h1>
  <p><strong>Privacy:</strong> All processing happens in your browser.</p>

  <div id="drop" class="drop">
    Drag & drop CSV here or <input type="file" id="fileInput" accept=".csv,text/csv" />
    <div><small>Expected columns: pdgaNumber, name, division (others are ignored)</small></div>
  </div>

  <div id="result" style="display:none;">
    <h2>Preview (editable)</h2>
    <div id="tableWrapper" style="display:none;">
      <table id="previewTable">
        <thead>
          <tr>
            <th>pdgaNumber</th>
            <th>firstName</th>
            <th>lastName</th>
            <th>division</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div style="margin-top:8px;">
        <button id="copyBtn">Copy TSV</button>
        <button id="downloadBtn">Download TSV</button>
      </div>
    </div>
  </div>
  
  <script src="js/app.js"></script>
</body>
</html>
